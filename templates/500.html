<!doctype html>
{# Página autónoma: Django la muestra sin contexto ni base, para no fallar dos veces. #}
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error del servidor · Aquadelluvia</title>
    <style>
        :root { --bg-main: #F8FAFC; --bg-surface: #FFFFFF; --color-primary: #4338ca; --text-main: #0f172a; --text-muted: #475569; }
        @media (prefers-color-scheme: dark) {
            :root { --bg-main: #0F172A; --bg-surface: #1E293B; --color-primary: #818cf8; --text-main: #f8fafc; --text-muted: #94a3b8; }
        }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg-main);
               color: var(--text-main); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
        .tarjeta { background: var(--bg-surface); border-radius: 16px; padding: 40px 32px; max-width: 480px;
                   text-align: center; box-shadow: 0 10px 30px rgba(15, 23, 42, .12); }
        h1 { font-size: 1.5rem; margin: 0 0 12px; }
        p { color: var(--text-muted); line-height: 1.5; }
        a { display: inline-block; margin-top: 12px; padding: 10px 24px; border-radius: 10px; font-weight: 700;
            background: var(--color-primary); color: #fff; text-decoration: none; }
    </style>
</head>
<body>
    <main class="tarjeta">
        <h1>Algo salió mal</h1>
        <p>Tuvimos un problema al procesar la solicitud. Probá de nuevo en unos minutos; si sigue pasando, avisanos.</p>
        <a href="/">Volver al inicio</a>
    </main>
</body>
</html>
