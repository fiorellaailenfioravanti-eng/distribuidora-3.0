{# Un campo del formulario con su etiqueta, ayuda y errores. Uso: include con campo=form.x #}
<label for="{{ campo.id_for_label }}" class="form-label fw-semibold small mb-1">{{ campo.label }}{% if campo.field.required %} <span class="text-danger">*</span>{% endif %}</label>
{{ campo }}
{% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
{% for error in campo.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
