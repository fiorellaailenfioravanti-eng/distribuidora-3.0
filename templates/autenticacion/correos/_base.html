<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>{{ asunto }}</title>
</head>
<body style="margin:0;padding:0;background:#F4F7FB;font-family:Arial,Helvetica,sans-serif;color:#13223F;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block resumen %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F7FB;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
      <tr><td align="center" style="padding-bottom:20px;">
        <span style="font-size:26px;font-weight:800;letter-spacing:-0.5px;color:#183068;"><span style="color:#5E8C17;">A</span>guadelluvia</span>
      </td></tr>
      <tr><td style="background:#FFFFFF;border:1px solid #D8E0EC;border-radius:16px;overflow:hidden;">
        <div style="height:6px;background:#1E4F91;background:linear-gradient(90deg,#1E4F91,#AAD03A);font-size:0;line-height:0;">&nbsp;</div>
        <div style="padding:32px 32px 28px;">
          {% block contenido %}{% endblock %}
        </div>
      </td></tr>
      <tr><td align="center" style="padding:20px 8px 0;font-size:12px;line-height:18px;color:#55657F;">
        Aguadelluvia · Distribuidora de agua<br>
        Este es un mensaje automático, no hace falta responderlo.
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
