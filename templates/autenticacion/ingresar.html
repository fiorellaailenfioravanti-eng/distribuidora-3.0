{% extends 'base_tienda.html' %}

{% block title %}Ingresar{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-4 bg-surface overflow-hidden mt-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h1 class="display-5 fw-bold text-dark tracking-tight mb-2">Bienvenido</h1>
                    <p class="text-muted">Ingresa a tu cuenta para continuar.</p>
                </div>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-5">
                        <button type="submit" class="btn btn-primary btn-glow btn-lg rounded-pill fw-bold hover-lift">Ingresar</button>
                    </div>
                </form>
                <div class="text-center mt-4 border-top pt-4">
                    <p class="text-muted mb-0">¿No tienes cuenta? <a href="{% url 'apps.autenticacion:registrar' %}" class="text-primary text-decoration-none fw-bold">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

{%endblock%}
