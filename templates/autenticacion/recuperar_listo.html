{% extends 'base_tienda.html' %}
{% block title %}Contraseña actualizada{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 columna-auth">
        <div class="card border-0 shadow-sm rounded-4 bg-surface mt-4">
            <div class="card-body p-4 p-md-5 text-center">
                <div class="icono-circulo icono-circulo--exito mx-auto mb-3"><i class="fa-solid fa-check"></i></div>
                <h1 class="h3 fw-bold mb-3">¡Listo!</h1>
                <p class="text-muted">Tu contraseña se cambió. Ya podés ingresar con la nueva.</p>
                <a href="{% url 'apps.autenticacion:ingresar' %}" class="btn btn-primary btn-glow rounded-pill px-5 mt-2">Ingresar</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
