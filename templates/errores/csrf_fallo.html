{% extends "base_tienda.html" %}

{% block title %}Sesión expirada · Aquadelluvia{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow rounded-4">
                <div class="card-body p-5 text-center">
                    <i class="fa-solid fa-clock-rotate-left text-warning"
                       style="font-size: 3rem;"></i>
                    <h1 class="h3 mt-4">Sesión expirada</h1>
                    <p class="text-muted">{{ mensaje }}</p>
                    <a href="{% url 'inicio' %}"
                       class="btn btn-primary rounded-3 fw-bold px-4 mt-2">
                        <i class="fa-solid fa-house me-2"></i>Volver al inicio
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
