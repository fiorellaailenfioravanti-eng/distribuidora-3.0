{% load static %}
{% comment %}
Popups del sitio (tienda y panel): mensajes de Django, errores de validación de
formularios y confirmaciones. La lógica vive en static/js/popups.js.
{% endcomment %}
{% if messages %}
<script id="mensajes-django" type="application/json">[{% for message in messages %}{"nivel": "{{ message.tags|escapejs }}", "texto": "{{ message|escapejs }}"}{% if not forloop.last %},{% endif %}{% endfor %}]</script>
{% endif %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
<script src="{% static 'js/popups.js' %}?v=4"></script>
