{% extends 'base_dashboard.html' %}

{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-danger border-0 shadow-sm text-center">
            <div class="card-body p-5">
                <i class="fa-solid fa-triangle-exclamation fa-3x text-danger mb-3"></i>
                <h4>¿Eliminar {{ tipo }}?</h4>
                <p class="text-muted mb-4">
                    Estás por eliminar <strong>{{ objeto }}</strong>. Esta acción no se puede deshacer.
                </p>
                <div class="d-flex gap-3 justify-content-center">
                    <a href="{% url volver %}" class="btn btn-outline-secondary">
                        <i class="fa-solid fa-xmark me-1"></i> Cancelar
                    </a>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="fa-solid fa-trash me-1"></i> Sí, eliminar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
