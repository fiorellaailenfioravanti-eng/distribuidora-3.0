{% extends 'base_dashboard.html' %}

{% block title %}Editar Camión{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="h3 fw-bold mb-1 text-main">Editar Camión</h1>
        <p class="text-muted small mb-0">{{ camion.patente }}</p>
    </div>
    <a href="{% url 'apps.logistica:listar_camiones' %}" class="btn btn-light border-0 shadow-sm rounded-3 hover-lift fw-bold">
        <i class="fa-solid fa-arrow-left me-1"></i> Volver
    </a>
</div>
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-4 bg-surface mb-5">
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-bold text-muted small text-uppercase">Patente</label>
                        {{ form.patente }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold text-muted small text-uppercase">Descripción</label>
                        {{ form.descripcion }}
                    </div>
                    <div class="mb-4 form-check form-switch fs-5">
                        {{ form.activo }}
                        <label class="form-check-label ms-2 fs-6 mt-1">Activo</label>
                    </div>
                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-primary btn-glow rounded-pill fw-bold btn-lg">
                            <i class="fa-solid fa-floppy-disk me-2"></i> Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
