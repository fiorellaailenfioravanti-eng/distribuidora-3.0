{% extends "base.html" %}
{% block title %} Eliminar {% endblock%}


{% block content %}
<div class="alert alert-danger">
    <h2>ELIMINACIÓN DE PRODUCTO ❌</h2>
    <p>¿Estás seguro de eliminar el producto "<strong>{{ producto.nombre }}</strong>"?</p>
    <p><strong>Descripción:</strong> {{ producto.descripcion }}</p>
    <p class="fw-bold">⚠️ Esta acción no se puede deshacer.</p>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmar Eliminación</button>
    <a href="{% url 'apps.productos:listar_productos' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock%}
